<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Avistamento — Entrar</title>
<link rel="stylesheet" href="frontend/css/styles.css" />
</head>
<body class="auth-body">
  <main class="auth-card">
    <h1>Avistamento</h1>
    <p class="muted">Compartilhe encontros com a fauna.</p>
    <div class="tabs">
      <button class="tab active" data-tab="login">Entrar</button>
      <button class="tab" data-tab="register">Criar conta</button>
    </div>
    <form id="auth-form" autocomplete="off">
      <label>Usuário<input name="username" required minlength="3" maxlength="32" pattern="[a-zA-Z0-9_.\-]+" /></label>
      <label>Senha<input name="password" type="password" required minlength="8" maxlength="128" /></label>
      <button type="submit" class="primary">Entrar</button>
      <p id="auth-msg" class="msg"></p>
    </form>
  </main>
  <script src="frontend/js/api.js"></script>
  <script src="frontend/js/auth.js"></script>
</body>
</html>
